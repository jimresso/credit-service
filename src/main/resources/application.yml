resilience4j:
  circuitbreaker:
    instances:
      circuitBreakerCreditCard:
        ignoreExceptions:
          - com.nttdata.creditproducts.service.exception.BusinessException
          - com.nttdata.creditproducts.service.exception.InsufficientFundsException
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 5s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakerevents
  endpoint:
    health:
      show-details: always

